<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiko Chat</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --accent:#0b5; --rule:#e6e6e6; --bg:#fff; --code-bg:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --muted:#9aa; --accent:#3db886; --rule:#2a2a2a; --bg:#16181c; --code-bg:#1f2329; }
  }
  * { box-sizing:border-box; }
  body { font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         color:var(--fg); background:var(--bg); max-width:640px; margin:0 auto; padding:4rem 1.4rem 5rem; }
  h1 { font-size:2rem; line-height:1.1; margin:0 0 .3rem; }
  .sub { color:var(--muted); font-size:1.05rem; margin:0 0 2.4rem; }
  ul.links { list-style:none; padding:0; margin:0; }
  ul.links li { margin:.2rem 0; border-top:1px solid var(--rule); }
  ul.links a { display:block; padding:1rem .2rem; color:var(--accent); text-decoration:none; font-size:1.1rem; }
  ul.links a:hover { text-decoration:underline; }
  .note { color:var(--muted); font-size:.9rem; margin-top:2.6rem; }
</style>
</head>
<body>

<h1>Aiko Chat</h1>
<p class="sub">A text messaging app.</p>

<ul class="links">
<li><a href="/privacy">Privacy Policy</a></li>
<li><a href="/terms">Terms of Use &amp; Community Guidelines</a></li>
<li><a href="/delete-account">Delete your account</a></li>
</ul>

<p class="note">Questions? Use the support contact listed on Aiko Chat's App Store / Google Play listing.</p>

</body>
</html>
